name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - stonecutter.properties.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mod version
        id: meta
        run: |
          VERSION=$(grep -E '^mod\.version' stonecutter.properties.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "mod.version couldnt find"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          
          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"alpha"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta.outputs.tag }} already exists, skipping.."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDKs
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        if: steps.check.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew buildAndCollect --stacktrace -Porg.gradle.java.installations.auto-detect=true

      - name: List jars
        if: steps.check.outputs.exists == 'false'
        run: |
          ls -la build/libs
          COUNT=$(ls build/libs/*.jar | wc -l)
          echo "$COUNT jar generated"
          if [ "$COUNT" -eq 0 ]; then exit 1; fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Synchronize ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: build/libs/*.jar